[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconax"
version = "0.2.0"
description = "A lightweight, developer-friendly website analyzer for HTTP, HTML, headers, cookies, robots.txt, DNS, TLS, and passive web intelligence."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "Chethan R" }
]

keywords = [
    "reconnaissance",
    "website-analyzer",
    "web-security",
    "http",
    "dns",
    "html",
    "tls",
    "security-headers",
    "bug-bounty",
    "cybersecurity",
    "developer-tools",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "dnspython>=2.6",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/Chethan-ULTIMAX/reconax"
Repository = "https://github.com/Chethan-ULTIMAX/reconax"
Issues = "https://github.com/Chethan-ULTIMAX/reconax/issues"

[project.scripts]
reconax = "reconax.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/reconax"]
